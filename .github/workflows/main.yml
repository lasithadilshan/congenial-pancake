name: Kali Linux RDP

on:
  workflow_dispatch:

jobs:
  kali-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install XFCE & XRDP
        run: |
          sudo apt update -qq
          sudo apt install -y xfce4 xrdp

      - name: Set RDP Password
        run: echo "runner:Kali@123" | sudo chpasswd

      - name: Configure XFCE Session
        run: |
          echo "xfce4-session" > ~/.xsession
          sudo adduser xrdp ssl-cert
          sudo systemctl enable xrdp
          sudo systemctl start xrdp

      - name: Download & Setup Ngrok
        run: |
          wget -q https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.zip
          unzip -q ngrok-v3-stable-linux-amd64.zip
          ./ngrok authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Start Ngrok TCP Tunnel
        run: |
          ./ngrok tcp 3389 --log=stdout &
          sleep 10

      - name: Show Connection Info
        run: |
          echo "==============================="
          curl -s http://127.0.0.1:4040/api/tunnels | python3 -c \
            "import sys,json; t=json.load(sys.stdin)['tunnels'][0]['public_url']; print('RDP Host :', t.replace('tcp://',''))"
          echo "Username : runner"
          echo "Password : Kali@123"
          echo "==============================="

      - name: Keep Alive
        run: sleep infinity
