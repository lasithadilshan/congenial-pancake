name: Windows RDP for GX Works2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Create RDP User
        shell: powershell
        run: |
          $username = "runneradmin"
          $password = "Pass@12345"

          # Check if user exists
          $userExists = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if (-not $userExists) {
              net user $username $password /add
          }

          # Add to Administrators group safely
          $groupCheck = net localgroup administrators | Select-String $username

          if (-not $groupCheck) {
              net localgroup administrators $username /add
          }

      - name: Disable Password Expiry
        shell: powershell
        run: |
          WMIC USERACCOUNT WHERE "Name='runneradmin'" SET PasswordExpires=FALSE

      - name: Download Ngrok
        shell: powershell
        run: |
          Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
          Expand-Archive ngrok.zip -DestinationPath ngrok

      - name: Authenticate Ngrok
        shell: powershell
        run: |
          .\ngrok\ngrok.exe authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"

      - name: Start Ngrok Tunnel
        shell: powershell
        run: |
          Start-Process -FilePath ".\ngrok\ngrok.exe" -ArgumentList "tcp 3389"

      - name: Wait for Tunnel
        shell: powershell
        run: |
          Start-Sleep -Seconds 20

      - name: Show RDP Details
        shell: powershell
        run: |
          $json = Invoke-RestMethod http://127.0.0.1:4040/api/tunnels
          $url = $json.tunnels[0].public_url

          Write-Host "================================="
          Write-Host "RDP HOST :" $url.Replace("tcp://","")
          Write-Host "USERNAME : runneradmin"
          Write-Host "PASSWORD : Pass@12345"
          Write-Host "================================="

      - name: Keep Runner Alive
        shell: powershell
        run: |
          Start-Sleep -Seconds 21600
