name: Windows RDP for GX Works2
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Enable Remote Desktop
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MinEncryptionLevel" -Value 1
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
          Restart-Service -Name "TermService" -Force

      - name: Create RDP User
        shell: powershell
        run: |
          $username = "runneradmin"
          $password = "Pass@12345"
          $userExists = Get-LocalUser -Name $username -ErrorAction SilentlyContinue
          if (-not $userExists) {
              net user $username $password /add
          }
          $groupCheck = net localgroup administrators | Select-String $username
          if (-not $groupCheck) {
              net localgroup administrators $username /add
          }

      - name: Download Cloudflare Tunnel
        shell: powershell
        run: |
          Invoke-WebRequest `
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe `
            -OutFile cloudflared.exe

      - name: Start Cloudflare Tunnel
        shell: powershell
        run: |
          Start-Process `
            -FilePath ".\cloudflared.exe" `
            -ArgumentList "tunnel --url tcp://localhost:3389 --no-autoupdate"

      - name: Wait for Tunnel
        shell: powershell
        run: |
          Start-Sleep -Seconds 15

      - name: Show RDP Details
        shell: powershell
        run: |
          # Get the tunnel URL from cloudflared log
          $logPath = "$env:USERPROFILE\.cloudflared\tunnel.log"
          Start-Sleep -Seconds 5
          $url = (Get-Content $logPath -ErrorAction SilentlyContinue | Select-String "trycloudflare.com") | Select-Object -Last 1
          Write-Host ""
          Write-Host "================================="
          Write-Host "RDP HOST : $url"
          Write-Host "USERNAME : runneradmin"
          Write-Host "PASSWORD : Pass@12345"
          Write-Host "================================="

      - name: Keep Runner Alive
        shell: powershell
        run: |
          Start-Sleep -Seconds 21600
