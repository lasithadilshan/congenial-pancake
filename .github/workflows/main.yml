name: GX Works2 PLC RDP

on:
  workflow_dispatch:

jobs:
  plc-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Create RDP User
        run: |
          net user plcuser Plc@12345 /add
          net localgroup administrators plcuser /add

      - name: Download Ngrok
        run: |
          Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
          Expand-Archive ngrok.zip

      - name: Authenticate Ngrok
        run: |
          .\ngrok.exe authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Start Ngrok Tunnel
        run: |
          Start-Process .\ngrok.exe -ArgumentList "tcp 3389"

      - name: Wait for Tunnel
        run: Start-Sleep -Seconds 15

      - name: Show RDP Details
        run: |
          $json = Invoke-RestMethod http://127.0.0.1:4040/api/tunnels
          $url = $json.tunnels[0].public_url
          Write-Host "================================="
          Write-Host "RDP HOST :" $url.Replace("tcp://","")
          Write-Host "USERNAME : plcuser"
          Write-Host "PASSWORD : Plc@12345"
          Write-Host "================================="

      - name: Download GX Works2 Installer
        run: |
          Write-Host "Upload GX Works2 installer manually after connecting."
          Write-Host "Then install GX Works2 inside the RDP."

      - name: Keep Runner Alive
        run: |
          Start-Sleep -Seconds 21600
