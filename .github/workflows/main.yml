name: Windows RDP for GX Works2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Create User
        shell: powershell
        run: |
          net user runneradmin Pass@12345 /add
          net localgroup administrators runneradmin /add

      - name: Set Password Never Expire
        shell: powershell
        run: |
          WMIC USERACCOUNT WHERE "Name='runneradmin'" SET PasswordExpires=FALSE

      - name: Download Ngrok
        shell: powershell
        run: |
          Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
          Expand-Archive ngrok.zip -DestinationPath ngrok

      - name: Auth Ngrok
        shell: powershell
        run: |
          .\ngrok\ngrok.exe authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"

      - name: Start Tunnel
        shell: powershell
        run: |
          Start-Process -FilePath ".\ngrok\ngrok.exe" -ArgumentList "tcp 3389"

      - name: Wait
        shell: powershell
        run: |
          Start-Sleep 20

      - name: Show Details
        shell: powershell
        run: |
          $json = Invoke-RestMethod http://127.0.0.1:4040/api/tunnels
          $url = $json.tunnels[0].public_url

          echo "=============================="
          echo "HOST: $($url.Replace('tcp://',''))"
          echo "USERNAME: runneradmin"
          echo "PASSWORD: Pass@12345"
          echo "=============================="

      - name: Keep Alive
        shell: powershell
        run: |
          Start-Sleep -Seconds 21600
