name: Windows RDP for GX Works2

on:
  workflow_dispatch:

jobs:
  rdp:
    name: GX Works2 Temporary Windows Desktop
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Join private Tailscale network
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Create RDP user and enable Remote Desktop securely
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $username = "gxrdp"
          $securePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          # Create the temporary RDP account, or reset its password if it already exists.
          if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) {
              Set-LocalUser -Name $username -Password $securePassword
          }
          else {
              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -FullName "GX Works2 RDP User" `
                -Description "Temporary GitHub Actions RDP account" `
                -PasswordNeverExpires
          }

          # Give the user permission to log in through RDP and install required software.
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue

          # Enable Remote Desktop with Network Level Authentication and TLS.
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" `
            -Value 2

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "MinEncryptionLevel" `
            -Value 3

          Set-Service -Name "TermService" -StartupType Automatic
          Restart-Service -Name "TermService" -Force

          # Disable broad/default RDP firewall rules.
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue |
            Disable-NetFirewallRule

          # Allow RDP only from Tailscale private-network IP addresses.
          Get-NetFirewallRule -DisplayName "RDP - Tailscale only" -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName "RDP - Tailscale only" `
            -Description "Allow RDP only from trusted Tailscale devices" `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Profile Any | Out-Null

          # Confirm that RDP is listening before continuing.
          $rdpReady = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -InformationLevel Quiet

          if (-not $rdpReady) {
              throw "RDP is not listening on TCP port 3389."
          }

      - name: Show RDP connection details
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $tailscaleIp = (& tailscale ip -4 | Select-Object -First 1).Trim()

          $tailscaleStatus = & tailscale status --json | ConvertFrom-Json
          $tailscaleDns = $tailscaleStatus.Self.DNSName.TrimEnd(".")

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "WINDOWS RDP IS READY"
          Write-Host "=============================================="
          Write-Host "RDP HOST (recommended): $tailscaleIp"
          Write-Host "RDP HOST (MagicDNS):    $tailscaleDns"
          Write-Host "USERNAME:                .\gxrdp"
          Write-Host "PASSWORD:                Use your RDP_PASSWORD GitHub secret"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Open your Remote Desktop client and connect using the IP above."

      - name: Keep temporary desktop available
        shell: powershell
        run: |
          # 5 hours 45 minutes, leaving setup/cleanup time before GitHub's 6-hour limit.
          Start-Sleep -Seconds 20700
